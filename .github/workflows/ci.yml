name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versi pnpm diambil dari field "packageManager" di package.json.
      # Jangan tambahkan `version:` di sini: action v4 menolak dua sumber versi.
      - uses: pnpm/action-setup@v4

      # `cache: pnpm` butuh pnpm-lock.yaml; aktifkan lagi setelah lockfile di-commit.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
